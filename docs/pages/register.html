<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Register — Volt Grid</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <div class="grid-lines"></div>
    <div class="visual-copy">
      <div class="eyebrow"><span class="dot"></span>JOIN THE NETWORK</div>
      <h1>Your EV's new favorite pit stop.</h1>
      <p>Create your account to start reserving chargers, earning reward points, and tracking every session in one place.</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">V</div>
        <div class="brand-name">Volt Grid</div>
      </div>

      <h2>Create your account</h2>
      <div class="subtitle">It takes less than a minute.</div>

      <form id="register-form">
        <div class="field">
          <label for="full_name">Full Name</label>
          <input class="input" type="text" id="full_name" placeholder="Jane Doe" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input class="input" type="tel" id="phone" placeholder="081 234 5678" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" placeholder="At least 6 characters" required minlength="6" />
        </div>
        <div class="field">
          <label for="confirm_password">Confirm Password</label>
          <input class="input" type="password" id="confirm_password" placeholder="Re-enter password" required minlength="6" />
        </div>

        <button class="btn btn-primary" type="submit" id="register-btn">Create Account</button>
      </form>

      <p style="text-align:center; margin-top:26px; font-size:13.5px; color:var(--text-1);">
        Already have an account? <a class="link-muted" href="/pages/login.html">Log in</a>
      </p>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
