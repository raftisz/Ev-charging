version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ev_charging_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ev_charging_db}
    ports:
      - "5432:5432"
    volumes:
      - ev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ev_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ev_charging_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ev_user}:${POSTGRES_PASSWORD:-ev_password}@db:5432/${POSTGRES_DB:-ev_charging_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me-in-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ev_postgres_data:
